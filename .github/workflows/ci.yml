name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # hermes-agent supports >=3.11,<3.14
        python-version: ["3.11", "3.12", "3.13"]
        # Exact release commits: capability floor and minimum full support.
        hermes-ref:
          - 2237be355906fbe6065ce1815711eee52b2d646e  # 0.21.1 / v2026.9.7
          - d337b736aa1e8ebecfab043842d13e4a2d2f48a3  # 0.21.4 / v2026.9.21
    steps:
      - uses: actions/checkout@v4

      - name: Check out hermes-agent release
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes-ref }}
          path: .hermes-agent

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The plugin and its tests only need the host source tree on
      # PYTHONPATH plus pytest/pyyaml — no hermes runtime dependencies,
      # no network, no credentials.
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml

      - name: Run tests
        env:
          HERMES_AGENT_REPO: ${{ github.workspace }}/.hermes-agent
        run: python -m pytest tests -q
